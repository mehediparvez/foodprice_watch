test:
  primary: 'per group: DM-HLN (core+group vs core) on each mapped long-history item
    at each horizon; Holm across items within group x horizon; alpha 0.05 two-sided'
  effect: delta relMAE (core+group minus core, both relative to naive) per item; mean
    across mapped items with 2,000-draw item bootstrap 95% CI
  placebo: same group columns copied from random mapped donor items onto an equal
    number of random unmapped items (seed = config seed + group index); matched-minus-placebo
    gap in mean delta relMAE with bootstrap CI
  benchmark: 'RQ1: LightGBM core and core+all forecasting groups (M1) vs naive on
    54 long-history series, gmean relMAE / win rate / DM-HLN+Holm per stratum, alongside
    the S05 classical models'
